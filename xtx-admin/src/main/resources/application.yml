server:
  port: 8081

spring:
  application:
    name: xtx-admin
  datasource:
    url: jdbc:mysql://localhost:3306/xtx?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

minio:
  # 用 127.0.0.1 不用 localhost：Windows 优先把 localhost 解析成 ::1，
  # 而 WSL NAT 中继的 IPv6 转发是坏的（IPv4 正常），走 ::1 会挂起/空响应
  endpoint: http://127.0.0.1:9000
  access-key: xtx-minio
  secret-key: admin123
  bucket: xtx