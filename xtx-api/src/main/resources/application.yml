server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: xtx-api
  datasource:
    url: jdbc:mysql://localhost:3306/xtx?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: leejie
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456

mybatis-plus:
