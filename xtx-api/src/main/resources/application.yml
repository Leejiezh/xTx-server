server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: xtx-api
  # dev profile 是 DevTokenController 注册的前提，生产环境不要激活
  profiles:
    active: dev
  datasource:
    url: jdbc:mysql://localhost:3306/xtx?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      password: 123456

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

minio:
  endpoint: http://localhost:9000
  access-key: leejie
  secret-key: leejie123
  bucket: xtx

file:
  image-types:
    - image/jpeg
    - image/png
    - image/webp
    - image/gif
  document-types:
    - application/pdf
    - application/vnd.openxmlformats-officedocument.wordprocessingml.document
    - application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
    - application/vnd.openxmlformats-officedocument.presentationml.presentation
    - text/plain
    - application/zip
  image-max-size: 10485760
  document-max-size: 52428800
  presigned-put-expiry: 900
  # MinIO 预签名 URL 上限 7 天，不可再调大
  presigned-get-expiry: 604800
  orphan-grace-hours: 24

wechat:
  app-id: wxd99dd411d77bb2b9
  app-secret: 1e58fa5e56c5ba0d7c07f7a085005fbd