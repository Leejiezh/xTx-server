# Redis配置文件
# 位置：docker/redis/redis.conf

################################ 网络配置 ################################

# 监听IP地址
bind 0.0.0.0

# 监听端口
port 6379

# TCP连接超时时间（秒）
timeout 300

# TCP backlog大小
tcp-backlog 511

################################ 通用配置 ################################

# 数据库数量
databases 16

# 日志级别：debug, verbose, notice, warning
loglevel notice

# 日志文件输出
logfile ""

################################ 安全配置 ################################

# Redis访问密码
requirepass yourpassword

################################ 快照（RDB）配置 ################################

# 是否启用RDB持久化（可选）
# save 900 1      # 900秒内至少有1个key变化
# save 300 10     # 300秒内至少有10个key变化
# save 60 10000   # 60秒内至少有10000个key变化

# RDB文件名
dbfilename dump.rdb

# 工作目录
dir /data

# 是否在后台保存
rdbcompression yes

# 是否校验RDB文件
rdbchecksum yes

################################ AOF持久化配置 ################################

# 启用AOF（推荐用于生产环境）
appendonly yes

# AOF文件名
appendfilename "appendonly.aof"

# AOF刷新策略：
# always    - 每个写命令都立即fsync（最安全，性能最差）
# everysec  - 每秒fsync一次（推荐）
# no        - 由操作系统决定fsync时机（最快，数据最不安全）
appendfsync everysec

# 是否在AOF重写时禁止fsync
no-appendfsync-on-rewrite no

# AOF文件大小触发重写的百分比
auto-aof-rewrite-percentage 100

# AOF文件大小触发重写的最小值（字节）
auto-aof-rewrite-min-size 67108864

################################ 内存管理 ################################

# 最大内存大小
maxmemory 512mb

# 内存满时驱逐策略：
# noeviction        - 不驱逐，返回错误（默认）
# allkeys-lru       - 在所有key中，优先驱逐最少使用的key
# allkeys-lfu       - 在所有key中，优先驱逐最不经常使用的key
# volatile-lru      - 在设置了expire的key中，优先驱逐最少使用的key
# volatile-lfu      - 在设置了expire的key中，优先驱逐最不经常使用的key
# volatile-ttl      - 在设置了expire的key中，优先驱逐剩余TTL最短的key
# volatile-random   - 在设置了expire的key中，随机驱逐
# allkeys-random    - 在所有key中，随机驱逐
maxmemory-policy allkeys-lru

# LRU样本大小
maxmemory-samples 5

################################ 慢查询日志 ################################

# 慢查询定义阈值（微秒）
slowlog-log-slower-than 10000

# 慢查询日志最大长度
slowlog-max-len 128

################################ 客户端输出缓冲限制 ################################

# 普通客户端
client-output-buffer-limit normal 0 0 0

# 复制从属连接
client-output-buffer-limit replica 256mb 64mb 60

# 发布/订阅客户端
client-output-buffer-limit pubsub 32mb 8mb 60

################################ 频率相关 ################################

# 键过期扫描的频率
hz 10

# 启用主动碎片整理
activerehashing yes

################################ 其他配置 ################################

# 是否启用受保护模式
protected-mode no

# 是否启用TCP keepalive
tcp-keepalive 300

# 守护进程模式（Docker中应该设为no）
daemonize no
